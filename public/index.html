<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectScoutIQ</title>
<style>
  :root {
    --bg-outer: #cec5b3;
    --card-bg: #ffffff;
    --header-bg: #f4f1ea;
    --ink: #1c1a16;
    --ink-muted: #6f6a5e;
    --border: #e6e1d5;
    --accent: #17140f;
    --accent-text: #ffffff;
    --step-inactive-bg: #e9e5da;
    --step-inactive-text: #9a9483;
    --radius-card: 20px;
    --radius-field: 10px;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    padding: 32px 16px;
    background: var(--bg-outer);
    color: var(--ink);
  }
  .layout {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    gap: 20px;
    align-items: stretch;
  }
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
  }

  .panel {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(20, 18, 12, 0.18);
  }
  .status-panel {
    flex: 0 0 400px;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 860px) {
    .status-panel { flex: 1 1 auto; }
  }
  .preview-panel {
    flex: 1 1 auto;
    min-height: 620px;
    display: flex;
    flex-direction: column;
  }

  .card-header {
    background: var(--header-bg);
    padding: 24px 26px 22px;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .brand-logo {
    width: 30px;
    height: 30px;
    border: 1.5px solid var(--ink-muted);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 600;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .brand-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  h1 {
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 400;
    margin: 0 0 8px;
    line-height: 1.25;
  }
  p.sub {
    font-size: 13.5px;
    color: var(--ink-muted);
    margin: 0;
    line-height: 1.5;
  }
  .card-body { padding: 24px 26px 26px; flex: 1; display: flex; flex-direction: column; }
  .steps {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .step-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    background: var(--step-inactive-bg);
    color: var(--step-inactive-text);
    flex-shrink: 0;
  }
  .step-dot.active { background: var(--accent); color: var(--accent-text); }
  .step-line { width: 22px; height: 1px; background: var(--border); }
  .step-label { font-size: 12.5px; font-weight: 600; margin-left: 2px; }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-field);
    font-size: 13.5px;
    font-family: var(--sans);
    color: var(--ink);
    background: #fff;
  }
  input:focus { outline: none; border-color: var(--ink); }
  input::placeholder { color: #b7b2a4; }
  button.primary {
    margin-top: 22px;
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-field);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .footer-note { font-size: 10.5px; color: var(--ink-muted); }
  .powered-by { font-size: 10.5px; color: var(--ink-muted); }
  .powered-by strong { color: var(--ink); font-weight: 700; }
  .error { color: #b3392c; font-size: 12.5px; margin-top: 10px; display: none; }
  .center-state { text-align: center; margin: auto; padding: 20px 4px; }
  .state-icon { font-size: 36px; margin-bottom: 12px; }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--step-inactive-bg);
    border-top-color: var(--ink);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .preview-panel iframe {
    width: 100%;
    height: 100%;
    min-height: 620px;
    border: none;
    display: block;
    flex: 1;
  }
  .preview-loading { margin: auto; text-align: center; padding: 40px; }
</style>
</head>
<body>
  <div class="layout" id="app">
    <div class="panel status-panel" id="status-panel">
      <div class="card-header">
        <div class="brand-row">
          <div class="brand-logo">LOGO</div>
          <div class="brand-label">Builder Logo</div>
        </div>
        <div class="spinner" style="margin-top:20px;"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
