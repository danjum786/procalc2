<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProCalc</title>
<style>
  :root {
    --bg-outer: #eef3f8;
    --card-bg: #ffffff;
    --header-bg: #f5f9fc;
    --ink: #121123;
    --ink-muted: #6b7385;
    --border: #e2e8f0;
    --accent: #27ace4;
    --accent-hover: #1f96c9;
    --accent-text: #ffffff;
    --step-inactive-bg: #e7edf3;
    --step-inactive-text: #9aa4b2;
    --radius-card: 20px;
    --radius-field: 10px;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--sans);
    padding: 24px;
    background: var(--bg-outer);
    color: var(--ink);
  }
  .layout {
    max-width: 1080px;
    height: calc(100vh - 48px);
    margin: 0 auto;
    display: flex;
    gap: 20px;
  }
  @media (max-width: 860px) {
    .layout { flex-direction: column; height: auto; }
    html, body { overflow: auto; }
  }

  .panel {
    background: var(--card-bg);
    border-radius: var(--radius-card);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(18, 17, 35, 0.12);
    height: 100%;
  }
  .status-panel {
    flex: 0 0 400px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  @media (max-width: 860px) {
    .status-panel { flex: 1 1 auto; height: auto; }
  }
  .preview-panel {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 860px) {
    .preview-panel { height: 500px; }
  }

  .card-header {
    background: var(--header-bg);
    padding: 22px 26px 20px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .brand-row {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  .brand-row img {
    height: 30px;
    display: block;
  }
  h1 {
    font-family: var(--sans);
    font-size: 21px;
    font-weight: 700;
    margin: 0 0 8px;
    line-height: 1.3;
    color: var(--ink);
  }
  p.sub {
    font-size: 13px;
    color: var(--ink-muted);
    margin: 0;
    line-height: 1.5;
  }
  .card-body {
    padding: 22px 26px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .steps {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    flex-shrink: 0;
  }
  .step-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    background: var(--step-inactive-bg);
    color: var(--step-inactive-text);
    flex-shrink: 0;
  }
  .step-dot.active { background: var(--accent); color: var(--accent-text); }
  .step-line { width: 22px; height: 1px; background: var(--border); }
  .step-label { font-size: 12.5px; font-weight: 600; margin-left: 2px; color: var(--ink); }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 14px;
    color: var(--ink);
  }
  label:first-of-type { margin-top: 0; }
  .field-wrap { position: relative; }
  .field-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--ink-muted);
    pointer-events: none;
  }
  input {
    width: 100%;
    padding: 10px 13px 10px 38px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-field);
    font-size: 13.5px;
    font-family: var(--sans);
    color: var(--ink);
    background: #fff;
  }
  input:focus { outline: none; border-color: var(--accent); }
  input::placeholder { color: #a6afbd; }
  button.primary {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-field);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
    flex-shrink: 0;
    transition: background 0.15s;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  .trust-note {
    font-size: 11px;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .trust-note svg { width: 12px; height: 12px; color: var(--accent); flex-shrink: 0; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .footer-note { font-size: 10.5px; color: var(--ink-muted); }
  .powered-by { font-size: 10.5px; color: var(--ink-muted); }
  .powered-by strong { color: var(--ink); font-weight: 700; }
  .error { color: #d64545; font-size: 12.5px; margin-top: 10px; display: none; }
  .center-state { text-align: center; margin: auto; padding: 16px 4px; }
  .state-icon { font-size: 34px; margin-bottom: 10px; }

  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 0 auto 14px;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.3;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .review-icon-wrap {
    position: relative;
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .review-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #dceffa;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.88); opacity: 0.6; }
    50% { transform: scale(1); opacity: 1; }
  }
  .review-icon-wrap svg {
    position: relative;
    width: 42px;
    height: 42px;
    color: var(--accent);
  }

  .preview-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    flex: 1;
  }
  .preview-loading { margin: auto; text-align: center; padding: 40px; }
</style>
</head>
<body>
  <div class="layout" id="app">
    <div class="panel status-panel" id="status-panel">
      <div class="card-header">
        <div class="brand-row"><img src="/logo.png" alt="ProCalc" /></div>
        <div class="dots" style="margin-top:20px;"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <script src="/app.js?v=3"></script>
</body>
</html>
