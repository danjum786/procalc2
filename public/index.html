<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectScoutIQ</title>
<style>
  :root {
    --bg-outer: #cec5b3;
    --card-bg: #ffffff;
    --header-bg: #f4f1ea;
    --ink: #1c1a16;
    --ink-muted: #6f6a5e;
    --border: #e6e1d5;
    --accent: #17140f;
    --accent-text: #ffffff;
    --step-inactive-bg: #e9e5da;
    --step-inactive-text: #9a9483;
    --radius-card: 20px;
    --radius-field: 10px;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--sans);
    margin: 0;
    padding: 40px 16px;
    background: var(--bg-outer);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card-bg);
    border-radius: var(--radius-card);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(20, 18, 12, 0.18);
  }
  .card-header {
    background: var(--header-bg);
    padding: 24px 28px 26px;
    position: relative;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand-logo {
    width: 30px;
    height: 30px;
    border: 1.5px solid var(--ink-muted);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
    flex-shrink: 0;
  }
  .brand-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 400;
    margin: 0 0 8px;
    line-height: 1.25;
  }
  p.sub {
    font-size: 14px;
    color: var(--ink-muted);
    margin: 0;
    line-height: 1.5;
  }
  .card-body { padding: 26px 28px 28px; }
  .steps {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
  }
  .step-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    background: var(--step-inactive-bg);
    color: var(--step-inactive-text);
    flex-shrink: 0;
  }
  .step-dot.active { background: var(--accent); color: var(--accent-text); }
  .step-line { width: 26px; height: 1px; background: var(--border); }
  .step-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-left: 4px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
    margin-top: 18px;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-field);
    font-size: 14px;
    font-family: var(--sans);
    color: var(--ink);
    background: #fff;
  }
  input:focus {
    outline: none;
    border-color: var(--ink);
  }
  input::placeholder { color: #b7b2a4; }
  button.primary {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-field);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }
  button.primary:disabled { opacity: 0.55; cursor: default; }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .footer-note { font-size: 11px; color: var(--ink-muted); }
  .powered-by {
    font-size: 11px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .powered-by strong { color: var(--ink); font-weight: 700; }
  .error {
    color: #b3392c;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
  .center-state { text-align: center; padding: 10px 4px 4px; }
  .state-icon { font-size: 34px; margin-bottom: 14px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--step-inactive-bg);
    border-top-color: var(--ink);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  iframe.calculator {
    width: 100%;
    height: 78vh;
    border: none;
    border-radius: var(--radius-field);
  }
  .card-body.full-bleed { padding: 0; }
</style>
</head>
<body>
  <div class="card" id="app">
    <div class="card-header">
      <div class="brand-row">
        <div class="brand-logo">LOGO</div>
        <div class="brand-label">Builder Logo</div>
      </div>
      <div class="spinner" style="margin-top:20px;"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
